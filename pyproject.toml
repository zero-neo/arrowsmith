[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arrowsmith"
dynamic = ["version"]
description = "Recover interaction rules and equations from vector fields"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Ashrit Mangalwedhekar" }]
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.hatch.version]
path = "src/arrowsmith/__init__.py"