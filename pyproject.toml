[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arrowsmith"
dynamic = ["version"]
description = "Recover interaction rules and equations from vector fields"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Ashrit Mangalwedhekar" }]
dependencies = ["numpy", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.hatch.version]
path = "src/arrowsmith/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
